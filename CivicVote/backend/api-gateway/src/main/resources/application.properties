spring.application.name=api-gateway
server.port=${GATEWAY_PORT:8080}
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=false
eureka.instance.hostname=${EUREKA_INSTANCE_HOSTNAME:localhost}
eureka.client.healthcheck.enabled=true
spring.cloud.gateway.server.webflux.discovery.locator.enabled=false
spring.cloud.gateway.server.webflux.routes[0].id=auth-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://AUTH-SERVICE
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/auth/**
spring.cloud.gateway.server.webflux.routes[1].id=election-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://ELECTION-SERVICE
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/elections/**
spring.cloud.gateway.server.webflux.routes[2].id=voting-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://VOTING-SERVICE
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/votes/**
spring.cloud.gateway.server.webflux.routes[3].id=result-service
spring.cloud.gateway.server.webflux.routes[3].uri=lb://RESULT-SERVICE
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/results/**
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedOrigins=${FRONTEND_ORIGIN:http://localhost:5173}
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedMethods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedHeaders=Authorization,Content-Type
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowCredentials=true
security.jwt.secret=${JWT_SECRET:local-development-secret-change-before-production-123456}
management.endpoints.web.exposure.include=health,info
